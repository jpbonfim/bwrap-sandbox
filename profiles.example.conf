# ==============================================================================
# Security-Hardened Sandbox: Profiles Configuration
# ==============================================================================
# Each section [profile-name] defines a composable sandbox profile.
# Sections named [profile-name:variant] define variants selected with '-p profile-name:variant'.
# A variant inherits its base profile: the base section is applied first and the variant's
# directives are layered on top (on conflicting mounts, the last registration wins).
# Supported directives:
#   description        = Summary text shown in --list-profiles
#   mount              = <ro|rw>:<path>   (supports ~ and $HOME expansion, repeatable)
#   protect            = <path>[/]        (read-only even inside a rw mount; if missing on the host, an
#                                          empty placeholder is created first so the agent cannot create
#                                          it: directory with trailing '/', file otherwise. Symlinks have
#                                          their target protected and are restored on exit if replaced.
#                                          Repeatable)
#   tmpfs              = <path>           (empty, writable tmpfs over a directory, e.g. inside a ro mount;
#                                          changes never reach the host. Created on the host if missing.
#                                          Repeatable)
#   env                = <NAME|PATTERN_*> (environment variable to forward, repeatable)
#   setenv             = <NAME>=<VALUE>   (fixed environment variable set inside the sandbox, repeatable)
#   dbus_auth          = true|false       (enables filtered Secret Service/Keyring proxy)
#   dbus_notifications = true|false       (enables filtered desktop notification proxy)
#   gui                = true|false       (exposes the X11/Wayland display and clipboard, same as --gui)
#   allow_userns       = true|false       (allows nested user namespaces, same as --allow-userns; exposes
#                                          more kernel attack surface, see README)
#   terminal_env       = true|false       (forwards terminal identification and color variables such as
#                                          TERM_PROGRAM and LS_COLORS, same as --terminal-env)
# ==============================================================================

[dev-tools]
description = Mounts host user toolchains (~/.cargo/bin, ~/.nvm, ~/.pyenv, mise, etc.) [Read-Only]
mount = ro:~/.local/bin
mount = ro:~/.cargo/bin
mount = ro:~/.nvm
mount = ro:~/.asdf
mount = ro:~/.asdf/shims
mount = ro:~/.pyenv
mount = ro:~/.pyenv/shims
mount = ro:~/.rustup
mount = ro:~/.fnm
mount = ro:~/.volta
mount = ro:~/.bun/bin
mount = ro:~/go/bin
mount = ro:~/.local/share/mise
mount = ro:~/.local/share/mise/shims
mount = ro:~/.local/share/mise/bin
mount = ro:~/.config/mise
mount = ro:~/.tool-versions
mount = ro:~/.mise.toml
mount = ro:~/.local/share/uv

[antigravity]
description = Mounts ~/.antigravity, ~/.antigravity-ide, ~/.gemini, configs and caches [RW], agy binary, Chrome and Playwright [RO], and filters D-Bus Keyring/Notifications
mount = rw:~/.antigravity
mount = rw:~/.antigravity-ide
mount = rw:~/.gemini
mount = rw:~/.config/antigravity
mount = rw:~/.config/Antigravity
mount = rw:~/.config/Antigravity IDE
mount = rw:~/.cache/antigravity
mount = ro:~/.local/bin/agy
mount = ro:~/.cache/ms-playwright-go
mount = ro:~/.cache/ms-playwright
# Playwright's registry of running browsers (written by @playwright/mcp), kept per sandbox session so
# entries planted from the sandbox are never read by Playwright tools on the host
tmpfs = ~/.cache/ms-playwright/b
# Google Chrome, used by Playwright's 'chrome' channel (skipped if not installed)
mount = ro:/opt/google/chrome
env = GEMINI_*
env = ANTIGRAVITY_*
env = GOOGLE_API_KEY
env = GOOGLE_APPLICATION_CREDENTIALS
# Security Note: 'dbus_auth = true' grants access to org.freedesktop.secrets (Keyring).
# While systemd1 is blocked, processes with access can read saved credentials in the user's keyring.
# Only enable this on profiles that strictly require host keyring integration.
dbus_auth = true
# Enables desktop notification forwarding (org.freedesktop.Notifications)
dbus_notifications = true
# Terminal identification (TERM_PROGRAM, TMUX, COLORTERM, etc.) so hyperlinks and colors match the host
terminal_env = true

[antigravity:standard]
description = Base profile plus GUI access and nested user namespaces (headed browsers with Chrome's own sandbox)
# Display and clipboard for headed browsers (Playwright 'headless: false') and pasting images
gui = true
# Lets Chrome build its own sandbox inside bwrap (otherwise it needs '--no-sandbox')
allow_userns = true

[antigravity:strict]
description = Read-only hooks, MCP config, skills, scripts, instructions, IDE settings, extensions and binaries
# Hooks, MCP servers, skills, scripts and plugins (entries may be symlinks to a dotfiles repository,
# so the whole directory is protected to prevent replacing them); per-project state stays writable
protect = ~/.gemini/config/
mount = rw:~/.gemini/config/projects
protect = ~/.gemini/antigravity-cli/settings.json
# Global instructions
protect = ~/.gemini/GEMINI.md
protect = ~/.gemini/AGENTS.md
# Antigravity authentication & credential scope configuration
protect = ~/.config/antigravity/
# Executables run by Antigravity, cache embedded binaries, and IDE extensions run on the host (in-sandbox updates will fail)
protect = ~/.gemini/bin/
protect = ~/.gemini/antigravity/bin/
protect = ~/.gemini/antigravity-cli/bin/
protect = ~/.antigravity/bin/
protect = ~/.antigravity/extensions/
protect = ~/.antigravity/argv.json
protect = ~/.antigravity-ide/extensions/
protect = ~/.antigravity-ide/argv.json
protect = ~/.cache/antigravity/bin/
protect = ~/.config/Antigravity/bin/
protect = ~/.config/Antigravity/User/settings.json
protect = ~/.config/Antigravity/User/keybindings.json
protect = ~/.config/Antigravity IDE/User/settings.json
protect = ~/.config/Antigravity IDE/User/keybindings.json

[claude]
description = Mounts ~/.claude, ~/.claude.json and Claude Code installation [RW], Playwright cache and Google Chrome [RO]
# Config, OAuth credentials (~/.claude/.credentials.json), sessions and history
mount = rw:~/.claude
mount = rw:~/.claude.json
# Native installer version locks and installed versions (writable so Claude Code can update itself)
mount = rw:~/.local/state/claude
mount = rw:~/.local/share/claude
mount = ro:~/.local/bin/claude
mount = ro:~/.cache/ms-playwright
# Playwright's registry of running browsers (written by @playwright/mcp), kept per sandbox session so
# entries planted from the sandbox are never read by Playwright tools on the host
tmpfs = ~/.cache/ms-playwright/b
# Google Chrome, used by Playwright's 'chrome' channel (skipped if not installed)
mount = ro:/opt/google/chrome
# ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, ANTHROPIC_MODEL, etc. ('claude setup-token' for CLAUDE_CODE_OAUTH_TOKEN)
env = ANTHROPIC_*
env = CLAUDE_CODE_OAUTH_TOKEN
# Desktop notifications from hooks (e.g. notify-send); no keyring access is granted
dbus_notifications = true
# Terminal identification (TERM_PROGRAM, TMUX, COLORTERM, etc.) so hyperlinks and colors match the host
terminal_env = true

[claude:standard]
description = Base profile plus GUI access and nested user namespaces (headed browsers with Chrome's own sandbox)
# Display and clipboard for headed browsers (Playwright 'headless: false') and pasting images
gui = true
# Lets Chrome build its own sandbox inside bwrap (otherwise it needs '--no-sandbox')
allow_userns = true

[claude:strict]
description = Read-only hooks/settings, skills, agents, commands, plugins, instructions and binary
# Hooks, statusline and permissions (/config, /model and similar commands cannot persist changes)
protect = ~/.claude/settings.json
# Global instructions, extensions that can carry hooks or change behavior, and common hook script location
protect = ~/.claude/CLAUDE.md
protect = ~/.claude/skills/
protect = ~/.claude/agents/
protect = ~/.claude/commands/
protect = ~/.claude/output-styles/
protect = ~/.claude/plugins/
protect = ~/.claude/hooks/
# Claude in Chrome native messaging host, executed by the browser on the host
protect = ~/.claude/chrome/
# Binary tamper protection (updates must run on the host with 'claude update')
mount = ro:~/.local/share/claude
setenv = DISABLE_AUTOUPDATER=1
# Not covered: MCP servers in ~/.claude.json (Claude Code must write this file) and project-level
# configuration inside the workspace (.claude/, .mcp.json), which shows up in 'git diff'.

[openai]
description = Forwards OpenAI API credentials
env = OPENAI_API_KEY

[deepseek]
description = Forwards DeepSeek API credentials
env = DEEPSEEK_API_KEY

[mistral]
description = Forwards Mistral API credentials
env = MISTRAL_API_KEY

[groq]
description = Forwards Groq API credentials
env = GROQ_API_KEY

[none]
description = No extra mounts or environment variables applied (default)
