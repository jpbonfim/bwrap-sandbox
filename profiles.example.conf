# ==============================================================================
# Security-Hardened Sandbox: Profiles Configuration
# ==============================================================================
# Each section [profile-name] defines a composable sandbox profile.
# Supported directives:
#   description        = Summary text shown in --list-profiles
#   mount              = <ro|rw>:<path>   (supports ~ and $HOME expansion, repeatable)
#   env                = <NAME|PATTERN_*> (environment variable to forward, repeatable)
#   dbus_auth          = true|false       (enables filtered Secret Service/Keyring proxy)
#   dbus_notifications = true|false       (enables filtered desktop notification proxy)
# ==============================================================================

[dev-tools]
description = Mounts host user toolchains (~/.cargo/bin, ~/.nvm, ~/.pyenv, etc.) [Read-Only]
mount = ro:~/.local/bin
mount = ro:~/.cargo/bin
mount = ro:~/.nvm
mount = ro:~/.asdf
mount = ro:~/.asdf/shims
mount = ro:~/.pyenv
mount = ro:~/.pyenv/shims
mount = ro:~/.rustup
mount = ro:~/.fnm
mount = ro:~/.volta
mount = ro:~/.bun/bin
mount = ro:~/go/bin

[antigravity]
description = Mounts ~/.antigravity, ~/.gemini [RW], Playwright cache [RO], and filters D-Bus Keyring/Notifications
mount = rw:~/.antigravity
mount = rw:~/.gemini
mount = ro:~/.cache/ms-playwright-go
mount = ro:~/.cache/ms-playwright
env = GEMINI_API_KEY
env = ANTIGRAVITY_*
# Security Note: 'dbus_auth = true' grants access to org.freedesktop.secrets (Keyring).
# While systemd1 is blocked, processes with access can read saved credentials in the user's keyring.
# Only enable this on profiles that strictly require host keyring integration.
dbus_auth = true
# Enables desktop notification forwarding (org.freedesktop.Notifications)
dbus_notifications = true

[claude]
description = Mounts Claude configuration and installation paths (~/.claude, ~/.claude.json, etc.) [RW]
mount = rw:~/.claude
mount = rw:~/.claude.json
mount = rw:~/.config/claude
mount = rw:~/.local/share/claude
mount = rw:~/.local/state/claude
env = ANTHROPIC_API_KEY

[openai]
description = Forwards OpenAI API credentials
env = OPENAI_API_KEY

[deepseek]
description = Forwards DeepSeek API credentials
env = DEEPSEEK_API_KEY

[mistral]
description = Forwards Mistral API credentials
env = MISTRAL_API_KEY

[groq]
description = Forwards Groq API credentials
env = GROQ_API_KEY

[none]
description = No extra mounts or environment variables applied (default)
